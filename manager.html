<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question Manager | Deloitte Confidence Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --deloitte-green: #86bc25; }
        body { font-family: 'Open Sans', sans-serif; background: #000; color: #fff; margin: 0; }
        nav { background: #1a1a1a; padding: 15px 25px; display: flex; gap: 30px; border-bottom: 1px solid #333; align-items: center; }
        nav img { height: 18px; margin-right: 10px; }
        nav a { color: #888; text-decoration: none; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        nav a.active { color: var(--deloitte-green); border-bottom: 2px solid var(--deloitte-green); padding-bottom: 5px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background: #111; border: 1px solid #222; padding: 30px; border-radius: 4px; margin-bottom: 30px; }
        h2 { font-weight: 300; margin-top: 0; border-left: 4px solid var(--deloitte-green); padding-left: 15px; }
        label { display: block; font-size: 0.7rem; text-transform: uppercase; color: #666; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; background: #050505; border: 1px solid #333; color: #fff; box-sizing: border-box; }
        .btn { padding: 12px 25px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-green { background: var(--deloitte-green); color: #000; width: 100%; }
        .btn-outline { background: none; color: #666; border: 1px solid #333; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; font-size: 0.7rem; color: #444; text-transform: uppercase; padding: 10px; border-bottom: 2px solid #222; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; font-size: 0.85rem; }
        .btn-sm { padding: 5px 10px; font-size: 0.65rem; background: #222; border: 1px solid #333; color: #888; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <img src="images/logo2.png" alt="Deloitte">
        <a href="facilitator.html">Facilitator Dashboard</a>
        <a href="manager.html" class="active">Question Manager</a>
    </nav>
    <div class="container">
        <h2>Add/Edit Question</h2>
        <div class="card">
            <input type="hidden" id="edit-idx" value="-1">
            <div style="display:flex; gap:20px;">
                <div style="flex:1;"><label>Market Challenge</label><input type="text" id="in-cat"></div>
                <div style="flex:1;"><label>Focus Area (Topic)</label><input type="text" id="in-sub"></div>
            </div>
            <label>Question Text</label>
            <textarea id="in-text" rows="3"></textarea>
            <button class="btn btn-green" onclick="saveLocal()">Update List Below</button>
            <button class="btn btn-outline" onclick="resetForm()">Clear Form</button>
        </div>
        <div class="card">
            <h2>Current Question Set</h2>
            <table>
                <thead><tr><th>Challenge</th><th>Topic</th><th>Question</th><th>Actions</th></tr></thead>
                <tbody id="q-body"></tbody>
            </table>
            <button class="btn btn-green" style="margin-top:40px; padding:25px;" onclick="syncCloud()">PUSH CHANGES TO LIVE DATABASE</button>
        </div>
    </div>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzd63iRBiIqlkEuFevIsQXy73oYLvJX2JhSwwrsLfCP-hkAWfdZ862eGa1CMD9YBnB3A/exec";
    let questions = [];
    async function load() {
        const r = await fetch(`${SCRIPT_URL}?get=questions`);
        questions = await r.json(); render();
    }
    function render() {
        document.getElementById('q-body').innerHTML = questions.map((q, i) => `
            <tr><td style="color:var(--deloitte-green); font-weight:bold">${q.category}</td>
                <td><strong>${q.sub}</strong></td>
                <td style="color:#aaa">${q.text}</td>
                <td><button class="btn-sm" onclick="edit(${i})">Edit</button>
                    <button class="btn-sm" style="color:#ff4d4d" onclick="del(${i})">Del</button></td></tr>`).join('');
    }
    function saveLocal() {
        const i = parseInt(document.getElementById('edit-idx').value);
        const q = { category: document.getElementById('in-cat').value, sub: document.getElementById('in-sub').value, text: document.getElementById('in-text').value };
        if(i === -1) questions.push(q); else questions[i] = q;
        render(); resetForm();
    }
    function edit(i) {
        document.getElementById('edit-idx').value = i;
        document.getElementById('in-cat').value = questions[i].category;
        document.getElementById('in-sub').value = questions[i].sub;
        document.getElementById('in-text').value = questions[i].text;
        window.scrollTo(0,0);
    }
    function del(i) { if(confirm("Remove?")) { questions.splice(i, 1); render(); } }
    function resetForm() { document.getElementById('edit-idx').value = "-1"; document.getElementById('in-cat').value = ""; document.getElementById('in-sub').value = ""; document.getElementById('in-text').value = ""; }
    function syncCloud() {
        if(!confirm("Push to LIVE?")) return;
        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "updateQuestions", data: questions }) }).then(() => {
            alert("Database updated!"); location.reload();
        });
    }
    load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deloitte Confidence Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --deloitte-green: #86bc25; }
        body { font-family: 'Open Sans', sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        #app-container { background: #111; width: 100%; max-width: 500px; padding: 40px; border-top: 6px solid var(--deloitte-green); text-align: center; box-sizing: border-box; }
        .hidden { display: none !important; }
        .logo { height: 24px; margin-bottom: 30px; }
        .cat-tag { color: var(--deloitte-green); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; border: 1px solid #333; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-bottom: 20px; letter-spacing: 1px; }
        .q-text { font-size: 1.3rem; line-height: 1.4; margin: 20px 0; min-height: 100px; font-weight: 300; color: #eee; }
        .score-num { font-size: 5rem; font-weight: 700; color: var(--deloitte-green); line-height: 1; margin: 10px 0; }
        button { width: 100%; padding: 18px; border: none; background: var(--deloitte-green); color: #000; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #97d72b; }
        input[type="text"] { width: 100%; padding: 14px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; box-sizing: border-box; }
        input[type="range"] { width: 100%; accent-color: var(--deloitte-green); margin: 20px 0; cursor: pointer; }
        
        .challenge-group { text-align: left; margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .challenge-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .challenge-title { font-weight: 700; color: var(--deloitte-green); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px;}
        .topic-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 8px 15px; border-left: 2px solid #222; margin-left: 5px; font-size: 0.8rem; }
        .insight-btn { border: 1px solid var(--deloitte-green); color: var(--deloitte-green); background: none; width: auto; padding: 4px 10px; font-size: 0.6rem; margin: 0; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .insight-btn:hover { background: var(--deloitte-green); color: #000; }
        .skip-link { font-size: 0.8rem; color: #555; text-decoration: underline; cursor: pointer; margin-top: 20px; display: block; }

        #modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:9999; display:none; flex-direction:column; justify-content:center; align-items:center; box-sizing: border-box; padding: 20px; }
        .carousel-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 900px; background: #111; border: 1px solid #222; padding: 10px; box-sizing: border-box; }
        #modal-img { max-width:100%; max-height:75vh; border: 1px solid #333; display: block; }
        .carousel-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 15px 0 5px 0; border-top: 1px solid #222; margin-top: 10px; box-sizing: border-box;}
        .carousel-btn { background: #222; color: var(--deloitte-green); border: 1px solid #333; width: auto; padding: 8px 20px; font-size: 0.7rem; margin: 0; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .carousel-btn:hover { background: #333; }
        .carousel-counter { font-size: 0.8rem; color: #666; font-weight: bold; }
    </style>
</head>
<body>

<div id="modal">
    <div class="carousel-container">
        <img id="modal-img" src="">
        <div class="carousel-controls">
            <button class="carousel-btn" onclick="changeSlide(-1)">PREV</button>
            <div id="slide-info" class="carousel-counter">1/1</div>
            <button class="carousel-btn" onclick="changeSlide(1)">NEXT</button>
        </div>
    </div>
    <button onclick="document.getElementById('modal').style.display='none'" style="background:none; color:#666; width:auto; border:1px solid #444; padding: 10px 30px; margin-top:30px; text-transform: uppercase;">CLOSE</button>
</div>

<div id="app-container">
    <img src="images/logo2.png" class="logo" alt="Deloitte">

    <div id="screen-start">
        <h2 style="font-weight:300;">Confidence Test:<br><strong style="font-weight:700;">Engaging with the Defence market</strong></h2>
        <button onclick="initQuiz()">Begin Test</button>
    </div>

    <div id="screen-quiz" class="hidden">
        <div id="q-counter" style="font-size: 0.7rem; color: #666; margin-bottom: 10px;"></div>
        <div id="q-cat" class="cat-tag"></div>
        <div id="q-text" class="q-text"></div>
        <div id="q-val" class="score-num">3</div>
        <input type="range" id="q-slider" min="1" max="5" value="3" oninput="document.getElementById('q-val').innerText=this.value">
        <button onclick="nextQuestion()">Next Step</button>
    </div>

    <div id="screen-reg" class="hidden">
        <h3 style="font-weight:700;">Assessment Complete</h3>
        <p style="color:#888; font-size:0.9rem;">Submit your details to compare with industry benchmarks.</p>
        <input type="text" id="reg-name" placeholder="Name">
        <input type="text" id="reg-email" placeholder="Email">
        <input type="text" id="reg-company" placeholder="Company">
        <button onclick="processFinal(false)">See Results</button>
        <span class="skip-link" onclick="processFinal(true)">Skip and see results anonymously</span>
    </div>

    <div id="screen-res" class="hidden">
        <div style="font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 1px;">Overall Maturity Score</div>
        <div id="res-total" class="score-num">0.0</div>
        <div style="height:250px; margin-bottom:30px;"><canvas id="radarChart"></canvas></div>
        <div id="res-list"></div>
        <button onclick="location.reload()" style="background:#222; color:#fff; border:1px solid #333;">Restart</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzd63iRBiIqlkEuFevIsQXy73oYLvJX2JhSwwrsLfCP-hkAWfdZ862eGa1CMD9YBnB3A/exec";
    let questions = [], currentIdx = 0, answers = [];
    let currentSlides = [], currentSlideIdx = 0;

    async function initQuiz() {
        const r = await fetch(`${SCRIPT_URL}?get=questions`);
        questions = await r.json();
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-quiz').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('q-counter').innerText = `Step ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('q-cat').innerText = q.category || "General";
        document.getElementById('q-text').innerText = q.text || "Question content missing";
        document.getElementById('q-slider').value = 3;
        document.getElementById('q-val').innerText = 3;
    }

    function nextQuestion() {
        answers.push({
            category: questions[currentIdx].category,
            sub: questions[currentIdx].sub || questions[currentIdx].topic || "General",
            score: parseInt(document.getElementById('q-slider').value)
        });
        if (++currentIdx < questions.length) renderQuestion();
        else {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-reg').classList.remove('hidden');
        }
    }

    async function processFinal(isAnon) {
        const total = (answers.reduce((a, b) => a + b.score, 0) / answers.length).toFixed(1);
        const name = isAnon ? "Anonymous" : document.getElementById('reg-name').value;
        
        fetch(SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ name, email: document.getElementById('reg-email').value, company: document.getElementById('reg-company').value, details: answers, total })
        });

        document.getElementById('screen-reg').classList.add('hidden');
        document.getElementById('screen-res').classList.remove('hidden');
        renderResults(total);
    }

    async function renderResults(total) {
        document.getElementById('res-total').innerText = total;
        
        const catAvgs = {};
        const categories = [...new Set(answers.map(a => a.category))];
        categories.forEach(c => {
            const scores = answers.filter(a => a.category === c).map(a => a.score);
            catAvgs[c] = scores.reduce((a, b) => a + b, 0) / scores.length;
        });

        new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: {
                // FIXED: Slices at the colon to show only "Market Challenge X" on the chart
                labels: Object.keys(catAvgs).map(label => label.split(':')[0]), 
                datasets: [{ data: Object.values(catAvgs), borderColor: '#86bc25', backgroundColor: 'rgba(134, 188, 37, 0.2)', borderWidth: 2, pointRadius: 0 }]
            },
            options: { 
                scales: { 
                    r: { 
                        min: 0, max: 5, 
                        ticks: { display: false }, 
                        grid: { color: '#333' }, 
                        angleLines: { color: '#333' },
                        pointLabels: {
                            color: '#888',
                            font: { size: 10 },
                            padding: 10 // Pushes labels slightly away from the graph
                        }
                    } 
                }, 
                plugins: { legend: { display: false } }, 
                maintainAspectRatio: false 
            }
        });

        let listHtml = "";
        for (let cat of categories) {
            const catSafe = cat.replace(/\s+/g, '');
            const catSlides = await findExistingSlides(catSafe);

            listHtml += `<div class="challenge-group">
                <div class="challenge-header">
                    <span class="challenge-title">${cat}</span>
                    ${catSlides.length > 0 ? `<button class="insight-btn" onclick="openCarousel('${catSafe}')">Insights</button>` : ''}
                </div>`;

            const topics = answers.filter(a => a.category === cat);
            for (let t of topics) {
                const topicSafe = t.sub.replace(/\s+/g, '');
                const topicSlides = await findExistingSlides(topicSafe);
                
                listHtml += `
                    <div class="topic-row">
                        <span>${t.sub}</span>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="color:#666; font-size:0.7rem;">${t.score}/5</span>
                            ${topicSlides.length > 0 ? `<button class="insight-btn" onclick="openCarousel('${topicSafe}')">Insights</button>` : ''}
                        </div>
                    </div>`;
            }
            listHtml += `</div>`;
        }
        document.getElementById('res-list').innerHTML = listHtml;
    }

    async function findExistingSlides(id) {
        let slides = [];
        for (let i = 1; i <= 5; i++) {
            const path = `slides/${id}_${i}.png`;
            const exists = await checkImage(path);
            if (exists) slides.push(path);
            else break;
        }
        return slides;
    }

    function checkImage(url) {
        return new Promise(res => {
            const img = new Image();
            img.onload = () => res(true);
            img.onerror = () => res(false);
            img.src = url;
        });
    }

    async function openCarousel(id) {
        currentSlides = await findExistingSlides(id);
        if (currentSlides.length === 0) return;
        currentSlideIdx = 0;
        updateCarouselUI();
        document.getElementById('modal').style.display = 'flex';
    }

    function updateCarouselUI() {
        document.getElementById('modal-img').src = currentSlides[currentSlideIdx];
        document.getElementById('slide-info').innerText = `${currentSlideIdx + 1}/${currentSlides.length}`;
    }

    function changeSlide(direction) {
        currentSlideIdx += direction;
        if (currentSlideIdx < 0) currentSlideIdx = currentSlides.length - 1;
        if (currentSlideIdx >= currentSlides.length) currentSlideIdx = 0;
        updateCarouselUI();
    }
</script>
</body>
</html>

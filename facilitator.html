<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facilitator Dashboard | Deloitte Confidence Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --deloitte-green: #86bc25; }
        body { font-family: 'Open Sans', sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        nav { background: #1a1a1a; padding: 15px 25px; display: flex; gap: 30px; border-bottom: 1px solid #333; align-items: center; }
        nav img { height: 18px; margin-right: 10px; }
        nav a { color: #888; text-decoration: none; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        nav a.active { color: var(--deloitte-green); border-bottom: 2px solid var(--deloitte-green); padding-bottom: 5px; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 350px; background: #111; border-right: 1px solid #333; overflow-y: auto; }
        .u-card { padding: 20px; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .u-card:hover { background: #1a1a1a; }
        .u-card.active { border-left: 5px solid var(--deloitte-green); background: #1a1a1a; }
        .u-score { background: #222; padding: 6px 10px; border-radius: 4px; font-weight: bold; color: var(--deloitte-green); border: 1px solid #333; }
        #content { flex: 1; padding: 40px; overflow-y: auto; background: #050505; }
        .badge { background: var(--deloitte-green); color: #000; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin: 30px 0; }
        .stat-card { background: #111; border: 1px solid #222; padding: 20px; border-top: 4px solid var(--deloitte-green); text-align: left; }
        .pos { color: var(--deloitte-green); } .neg { color: #ff4d4d; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: #111; }
        th { background: #1a1a1a; color: #888; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; }
        td, th { padding: 15px; border-bottom: 1px solid #222; text-align: left; }
        .q-row { background: #0a0a0a; display: none; color: #888; font-style: italic; font-size: 0.85rem; }
        tr.expanded + .q-row { display: table-row; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<nav>
    <img src="images/logo2.png" alt="Deloitte">
    <a href="facilitator.html" class="active">Facilitator Dashboard</a>
    <a href="manager.html">Question Manager</a>
</nav>
<div id="main">
    <div id="sidebar">
        <div style="padding:20px; background:#111; color:#666; font-weight:bold; font-size:0.7rem; letter-spacing:1px; border-bottom: 1px solid #222;">RECENT SUBMISSIONS</div>
        <div id="list"></div>
    </div>
    <div id="content">
        <div id="no-selection" style="text-align:center; margin-top:100px; color:#444;">
            <h3>Select a submission from the sidebar to view details</h3>
        </div>
        <div id="view" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div><h1 id="v-name" style="margin:0; font-weight:300;"></h1><p id="v-meta" style="color:#888; margin-top:5px;"></p></div>
                <div id="v-badge" class="badge"></div>
            </div>
            <div id="summary" class="summary-grid"></div>
            <div style="display:flex; gap:40px; flex-wrap: wrap;">
                <div style="width:400px; background:#111; padding:20px; border:1px solid #222;"><canvas id="fChart"></canvas></div>
                <div style="flex:1; min-width: 450px;">
                    <table>
                        <thead><tr><th>Challenge</th><th>Topic</th><th>Score</th><th>Variance</th></tr></thead>
                        <tbody id="v-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzd63iRBiIqlkEuFevIsQXy73oYLvJX2JhSwwrsLfCP-hkAWfdZ862eGa1CMD9YBnB3A/exec";
    const tiers = ["Initial", "Developing", "Defined", "Managed", "Optimized"];
    let subs = [], quests = [], chart = null;

    async function loadData() {
        try {
            const [qRes, sRes] = await Promise.all([
                fetch(`${SCRIPT_URL}?get=questions`).then(r => r.json()),
                fetch(SCRIPT_URL).then(r => r.json())
            ]);
            quests = qRes; subs = sRes;
            document.getElementById('list').innerHTML = subs.slice().reverse().map((s, i) => {
                const idx = subs.length - 1 - i;
                return `<div class="u-card" onclick="viewU(${idx}, this)">
                    <div><strong>${s.name}</strong><br><small style="color:#666">${s.company}</small></div>
                    <div class="u-score">${parseFloat(s.total).toFixed(1)}</div>
                </div>`;
            }).join('');
        } catch(e) { document.getElementById('list').innerText = "Sync Error."; }
    }

    function viewU(idx, el) {
        document.getElementById('no-selection').classList.add('hidden');
        document.querySelectorAll('.u-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('view').classList.remove('hidden');
        const u = subs[idx];
        document.getElementById('v-name').innerText = u.name;
        document.getElementById('v-meta').innerText = `${u.company} | ${u.email}`;
        document.getElementById('v-badge').innerText = tiers[Math.min(4, Math.floor(u.total - 0.1))].toUpperCase();

        const cats = [...new Set(quests.map(q => q.category))];
        const stats = cats.map(cat => {
            const uScores = u.scores.filter(s => s.category === cat);
            const uAvg = uScores.reduce((a, b) => a + b.score, 0) / (uScores.length || 1);
            let allIndScores = [];
            subs.forEach(s => {
                const cScores = s.scores.filter(sc => sc.category === cat);
                if(cScores.length) allIndScores.push(cScores.reduce((a,b)=>a+b.score,0)/cScores.length);
            });
            const gAvg = allIndScores.length ? (allIndScores.reduce((a,b)=>a+b,0)/allIndScores.length) : uAvg;
            return { cat, uAvg, gAvg, diff: ((uAvg - gAvg) / (gAvg || 1)) * 100 };
        });

        document.getElementById('summary').innerHTML = stats.map(s => `
            <div class="stat-card">
                <small style="color:#666; text-transform:uppercase; font-size:0.6rem; letter-spacing:1px;">${s.cat}</small>
                <div class="${s.diff >= 0 ? 'pos' : 'neg'}" style="font-weight:bold; font-size:1.4rem; margin-top:5px;">
                    ${s.diff >= 0 ? '▲' : '▼'} ${Math.abs(s.diff).toFixed(0)}%
                </div>
            </div>`).join('');

        document.getElementById('v-body').innerHTML = u.scores.map(s => {
            const q = quests.find(q => q.sub === s.sub) || { text: "No text found." };
            const catStat = stats.find(st => st.cat === s.category);
            return `<tr onclick="this.classList.toggle('expanded')" style="cursor:pointer">
                <td style="color:#666; font-size:0.75rem;">${s.category}</td>
                <td><strong>${s.sub}</strong></td>
                <td><span style="color:var(--deloitte-green)">${s.score}</span>/5</td>
                <td class="${catStat.diff >= 0 ? 'pos' : 'neg'}">${catStat.diff >= 0 ? '+' : ''}${catStat.diff.toFixed(0)}%</td></tr>
                <tr class="q-row"><td colspan="4">Question: ${q.text}</td></tr>`;
        }).join('');

        if(chart) chart.destroy();
        chart = new Chart(document.getElementById('fChart'), {
            type: 'radar',
            data: {
                labels: cats,
                datasets: [
                    { label: 'Client', data: stats.map(s => s.uAvg), borderColor: '#86bc25', backgroundColor: 'rgba(134, 188, 37, 0.2)', borderWidth: 3 },
                    { label: 'Industry Average', data: stats.map(s => s.gAvg), borderColor: '#fff', borderDash: [5,5], fill: false, pointRadius: 0 }
                ]
            },
            options: { 
                scales: { r: { min: 0, max: 5, ticks: { display: false }, grid: { color: '#333' } } },
                plugins: { legend: { display: false } },
                maintainAspectRatio: false
            }
        });
    }
    window.onload = loadData;
</script>
</body>
</html>
